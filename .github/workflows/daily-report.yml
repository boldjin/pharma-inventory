name: 일일 재고 리포트 이메일 발송

on:
  schedule:
    # KST 07:07 발송 — UTC로는 전날 22:07 → 평일 KST 발송 위해 UTC Sun-Thu(0-4) 사용
    # 백업 cron 제거 — 중복 발송 방지 (지연되더라도 단일 실행 보장)
    - cron: '7 22 * * 0-4'   # 평일 KST 07:07
  workflow_dispatch:        # 수동 테스트용

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 패키지 설치
        run: npm install @supabase/supabase-js@2.49.4 xlsx nodemailer

      - name: 리포트 생성 및 이메일 발송
        run: node scripts/send-report.js
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_USER_ID:      ${{ secrets.SUPABASE_USER_ID }}
          SMTP_HOST:             ${{ secrets.SMTP_HOST }}
          SMTP_PORT:             ${{ secrets.SMTP_PORT }}
          SMTP_USER:             ${{ secrets.SMTP_USER }}
          SMTP_PASS:             ${{ secrets.SMTP_PASS }}
          RECIPIENT:             forzaackj@naver.com,rod.koc.2025@gmail.com
          FORCE_SEND:            ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
